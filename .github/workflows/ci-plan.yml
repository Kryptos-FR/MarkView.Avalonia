name: CI plan

# Decides what a CI run does, from the event, the pull request's labels and the paths it
# changes. Called by ci.yml for every run, and by pr-labels.yml when `ci-mutation-testing`
# is added, so both pick the same mutation shards.
#
# Pull requests only run what their changes need:
# - docs-only changes run nothing (Gate still reports);
# - drafts only build and test on Ubuntu, unless labelled `ci-run-on-draft`;
# - mutation testing only runs when labelled `ci-mutation-testing` (drafts included) or
#   `ci-full`. With `ci-mutation-testing` it only covers the packages the pull request
#   touches, and within them only the code it changes (Stryker's `--since`); `ci-full` runs
#   it in full;
# - the AOT publish runs on Ubuntu only, unless labelled `ci-full`.
# Pushes to main run everything, but mutation testing only covers the code changed since the
# previous main commit (in full when that commit is not an ancestor, e.g. after a force push).
# Manual runs run everything in full; releases skip mutation testing, which already ran on main.

on:
  workflow_call:
    outputs:
      build-os:
        description: JSON array of the runner OSes to build and test on
        value: ${{ jobs.changes.outputs.build-os }}
      aot-os:
        description: JSON array of the runner OSes to run the AOT publish on
        value: ${{ jobs.changes.outputs.aot-os }}
      mutation-projects:
        description: JSON array of the test projects to run Stryker in
        value: ${{ jobs.changes.outputs.mutation-projects }}
      mutation-since:
        description: The committish to pass to Stryker's --since, empty for a full run
        value: ${{ jobs.changes.outputs.mutation-since }}

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      build-os: ${{ steps.plan.outputs.build-os }}
      aot-os: ${{ steps.plan.outputs.aot-os }}
      mutation-projects: ${{ steps.plan.outputs.mutation-projects }}
      mutation-since: ${{ steps.plan.outputs.mutation-since }}
    steps:
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            shared:
              - 'Directory.Build.props'
              - 'Directory.Packages.props'
              - 'global.json'
              - '*.slnx'
              - 'testconfig.json'
              - '.config/**'
              - 'tests/Directory.Build.props'
              - 'tests/Shared/**'
              - '.github/workflows/**'
              - '.github/scripts/**'
            core:
              - 'src/MarkView.Avalonia/**'
              - 'tests/MarkView.Avalonia.Tests/**'
            math:
              - 'src/MarkView.Avalonia.Math/**'
              - 'tests/MarkView.Avalonia.Math.Tests/**'
            mermaid:
              - 'src/MarkView.Avalonia.Mermaid/**'
              - 'tests/MarkView.Avalonia.Mermaid.Tests/**'
            svg:
              - 'src/MarkView.Avalonia.Svg/**'
              - 'tests/MarkView.Avalonia.Svg.Tests/**'
            syntax:
              - 'src/MarkView.Avalonia.SyntaxHighlighting/**'
              - 'tests/MarkView.Avalonia.SyntaxHighlighting.Tests/**'
            samples:
              - 'samples/**'

      - name: Plan the run
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          DRAFT: ${{ github.event.pull_request.draft }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          SHARED: ${{ steps.filter.outputs.shared }}
          CORE: ${{ steps.filter.outputs.core }}
          MATH: ${{ steps.filter.outputs.math }}
          MERMAID: ${{ steps.filter.outputs.mermaid }}
          SVG: ${{ steps.filter.outputs.svg }}
          SYNTAX: ${{ steps.filter.outputs.syntax }}
          SAMPLES: ${{ steps.filter.outputs.samples }}
        run: |
          all_os='["ubuntu-latest","windows-latest","macos-latest"]'
          all_projects='["MarkView.Avalonia.Tests","MarkView.Avalonia.Math.Tests","MarkView.Avalonia.Mermaid.Tests","MarkView.Avalonia.Svg.Tests","MarkView.Avalonia.SyntaxHighlighting.Tests"]'
          has_label() { echo "$LABELS" | jq -e --arg l "$1" 'index($l) != null' > /dev/null; }

          if [ "$EVENT" != "pull_request" ]; then
            build_os=$all_os
            aot_os=$all_os
            if [ "$EVENT" = "release" ]; then mutation_projects='[]'; else mutation_projects=$all_projects; fi
            since=''
            # The commit main pointed to before this push, when this push only added commits on top
            # of it: a new branch has no previous commit (all zeros) and a force push leaves it off
            # the history.
            if [ "$EVENT" = "push" ] && [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
              status=$(gh api "repos/$REPO/compare/$BEFORE...$SHA" --jq .status || true)
              if [ "$status" = "ahead" ]; then since=$BEFORE; fi
            fi
          else
            full=false
            if has_label ci-full; then full=true; fi
            heavy=true
            if [ "$DRAFT" = "true" ] && [ "$full" = false ] && ! has_label ci-run-on-draft; then heavy=false; fi

            code=false
            for flag in "$SHARED" "$CORE" "$MATH" "$MERMAID" "$SVG" "$SYNTAX"; do
              if [ "$flag" = "true" ]; then code=true; fi
            done

            build_os='[]'
            if [ "$code" = true ]; then
              if [ "$heavy" = true ]; then build_os=$all_os; else build_os='["ubuntu-latest"]'; fi
            fi

            aot_os='[]'
            if [ "$heavy" = true ] && { [ "$code" = true ] || [ "$SAMPLES" = "true" ]; }; then
              if [ "$full" = true ]; then aot_os=$all_os; else aot_os='["ubuntu-latest"]'; fi
            fi

            # Mutation testing is the slowest suite, so pull requests only run it on request. The
            # label asks for it explicitly, so it runs on a draft too.
            mutation_projects='[]'
            since=''
            if [ "$full" = true ] || has_label ci-mutation-testing; then
              if [ "$full" = true ] || [ "$SHARED" = "true" ]; then
                mutation_projects=$all_projects
              else
                list=()
                if [ "$CORE" = "true" ]; then list+=("MarkView.Avalonia.Tests"); fi
                if [ "$MATH" = "true" ]; then list+=("MarkView.Avalonia.Math.Tests"); fi
                if [ "$MERMAID" = "true" ]; then list+=("MarkView.Avalonia.Mermaid.Tests"); fi
                if [ "$SVG" = "true" ]; then list+=("MarkView.Avalonia.Svg.Tests"); fi
                if [ "$SYNTAX" = "true" ]; then list+=("MarkView.Avalonia.SyntaxHighlighting.Tests"); fi
                mutation_projects=$(printf '%s\n' "${list[@]}" | jq -R . | jq -cs 'map(select(. != ""))')
              fi
              if [ "$full" = false ]; then
                # In a stack of pull requests, github.base_ref is the stack's base (main) for every
                # pull request in it, so diffing against it would mutate the whole stack below. The
                # pull request's own base branch is only in the API.
                own_base=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq .base.ref || true)
                since="origin/${own_base:-$BASE_REF}"
              fi
            fi
          fi

          {
            echo "build-os=$build_os"
            echo "aot-os=$aot_os"
            echo "mutation-projects=$mutation_projects"
            echo "mutation-since=$since"
          } | tee -a "$GITHUB_OUTPUT"
