name: Coverage

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  coverage:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      - name: Restore
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test with coverage
        run: dotnet test --no-build --configuration Release --results-directory TestResults --coverage --config-file testconfig.json

      - name: Generate report and enforce threshold
        uses: danielpalme/ReportGenerator-GitHub-Action@5
        with:
          reports: 'TestResults/**/*.cobertura.xml'
          targetdir: coveragereport
          reporttypes: 'Html;MarkdownSummaryGithub'
          customSettings: 'minimumCoverageThresholds:lineCoverage=80'

      - name: Upload HTML coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: coveragereport/

      - name: Check coverage thresholds
        shell: pwsh
        run: |
          $summaryFile = "coveragereport/SummaryGithub.md"
          if (-not (Test-Path $summaryFile)) {
            Write-Error "Summary file not found: $summaryFile"
            exit 1
          }
          
          $content = Get-Content $summaryFile -Raw
          
          # Extract overall line coverage from "| **Line coverage:** | XX% ..." pattern
          if ($content -match '\|\s*\*\*Line coverage:\*\*\s*\|\s*(\d+\.?\d*)%') {
            $lineCoverage = [double]$matches[1]
            Write-Output "Overall line coverage: $lineCoverage%"
            
            $minThreshold = 80
            if ($lineCoverage -lt $minThreshold) {
              Write-Error "Line coverage $lineCoverage% is below the required $minThreshold%"
              exit 1
            }
            Write-Output "✓ Line coverage meets the required $minThreshold%"
          } else {
            Write-Error "Could not parse line coverage from summary"
            exit 1
          }

          $projectMin = 70
          $projectFailed = $false
          foreach ($m in [regex]::Matches($content, '<summary>(?<name>[^<]+?) - (?<pct>\d+(\.\d+)?)%</summary>')) {
            $pct = [double]$m.Groups['pct'].Value
            if ($pct -lt $projectMin) {
              Write-Output "::error::$($m.Groups['name'].Value) line coverage $pct% is below the required $projectMin%"
              $projectFailed = $true
            }
          }
          if ($projectFailed) { exit 1 }

      - name: Post coverage summary to PR
        uses: marocchino/sticky-pull-request-comment@v3
        if: always() && github.event_name == 'pull_request'
        with:
          header: coverage
          recreate: true
          path: coveragereport/SummaryGithub.md
