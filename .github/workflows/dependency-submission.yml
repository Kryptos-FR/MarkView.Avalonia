name: Dependency Submission

# Keeps the repository's dependency graph up to date from main. Pull requests don't need it:
# nothing reviews their dependency snapshot.
on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: write

jobs:
  submit-nuget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      - name: Restore
        run: dotnet restore --locked-mode

      - uses: advanced-security/component-detection-dependency-submission-action@v0.1.6
        with:
          detectorsCategories: NuGet
          directoryExclusionList: 'samples'
