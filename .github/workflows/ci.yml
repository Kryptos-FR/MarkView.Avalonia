name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

# A new push to a pull request cancels that pull request's previous run, so a superseded
# run can never post its coverage/mutation comment after the current one. Pushes to main
# and tags get a group of their own and are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    uses: ./.github/workflows/build.yml
    with:
      os: ${{ matrix.os }}

  coverage:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/coverage.yml

  mutation:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/mutation.yml

  aot-publish:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    uses: ./.github/workflows/aot-publish.yml
    with:
      os: ${{ matrix.os }}

  publish:
    needs: [build, aot-publish]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      id-token: write
    uses: ./.github/workflows/publish.yml
    with:
      dry-run: true
