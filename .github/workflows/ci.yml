name: CI

on:
  push:
    branches: [main]
  # Any base branch: a pull request opened on another branch (e.g. the one below it in a
  # stack) would otherwise get no run, and Gate would never report.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # Publishing a GitHub release builds the tag and pushes the packages to NuGet.org.
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels that pull request's previous run, so a superseded
# run can never post its coverage/mutation comment after the current one. Pushes to main
# and releases get a group of their own and are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # Decides what the rest of the run does: see ci-plan.yml. In short, pull requests only run
  # what their changes need, and only run mutation testing when labelled `ci-mutation-testing`
  # or `ci-full`; pushes to main run everything, mutation testing included.
  changes:
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/ci-plan.yml

  build:
    needs: changes
    if: needs.changes.outputs.build-os != '[]'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.build-os) }}
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/build.yml
    with:
      os: ${{ matrix.os }}
      coverage: ${{ matrix.os == 'ubuntu-latest' }}

  aot-publish:
    needs: changes
    if: needs.changes.outputs.aot-os != '[]'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.aot-os) }}
    uses: ./.github/workflows/aot-publish.yml
    with:
      os: ${{ matrix.os }}

  mutation:
    needs: changes
    if: needs.changes.outputs.mutation-projects != '[]'
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/mutation.yml
    with:
      projects: ${{ needs.changes.outputs.mutation-projects }}
      since: ${{ needs.changes.outputs.mutation-since }}

  # The only check branch protection needs to require. Skipped jobs (nothing to run for
  # these changes, or a draft) count as passing; a failed or cancelled one does not.
  # always() on purpose: a cancelled run must report a red Gate, not a skipped one.
  gate:
    name: Gate
    needs: [changes, build, aot-publish, mutation]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any needed job failed or was cancelled
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.value.result)\t\(.key)"'
          test "$(echo "$NEEDS" | jq '[.[] | select(.result == "failure" or .result == "cancelled")] | length')" -eq 0

  publish:
    needs: [build, aot-publish]
    if: github.event_name == 'release'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish.yml
    with:
      dry-run: false
