name: CI

on:
  push:
    branches: [main]
  # Any base branch: a pull request opened on another branch (e.g. the one below it in a
  # stack) would otherwise get no run, and Gate would never report.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # Publishing a GitHub release builds the tag and pushes the packages to NuGet.org.
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels that pull request's previous run, so a superseded
# run can never post its coverage/mutation comment after the current one. Pushes to main
# and releases get a group of their own and are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # Decides what the rest of the run does. Pull requests only run what their changes need:
  # - docs-only changes run nothing (Gate still reports): Markdown files never count as code,
  #   wherever they are, except the test projects' own test documents;
  # - drafts only build and test on Ubuntu, unless labelled `ci-run-on-draft`;
  # - mutation testing only runs when labelled `ci-mutation-testing` (drafts included) or
  #   `ci-full`. With `ci-mutation-testing` it only covers the packages the pull request touches,
  #   and within them only the code it changes (Stryker's `--since`); `ci-full` runs it in full;
  # - the AOT publish runs on Ubuntu only, unless labelled `ci-full`.
  # Pushes to main run everything, but mutation testing only covers the code changed since the
  # previous main commit (in full when that commit is not an ancestor, e.g. after a force push).
  # Manual runs run everything in full; releases skip mutation testing, which already ran on main.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      build-os: ${{ steps.plan.outputs.build-os }}
      aot-os: ${{ steps.plan.outputs.aot-os }}
      mutation-projects: ${{ steps.plan.outputs.mutation-projects }}
      mutation-since: ${{ steps.plan.outputs.mutation-since }}
    steps:
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'pull_request'
        with:
          # A file counts when it matches one of a filter's patterns and none of its '!' ones.
          predicate-quantifier: some-with-excludes
          filters: |
            shared:
              - 'Directory.Build.props'
              - 'Directory.Packages.props'
              - 'global.json'
              - '*.slnx'
              - 'testconfig.json'
              - '.config/**'
              - 'tests/Directory.Build.props'
              - 'tests/Shared/**'
              - '.github/workflows/**'
              - '.github/scripts/**'
              - '!**/*.md'
            core:
              - 'src/MarkView.Avalonia/**'
              - 'tests/MarkView.Avalonia.Tests/**'
              - '!src/**/*.md'
            math:
              - 'src/MarkView.Avalonia.Math/**'
              - 'tests/MarkView.Avalonia.Math.Tests/**'
              - '!src/**/*.md'
            mermaid:
              - 'src/MarkView.Avalonia.Mermaid/**'
              - 'tests/MarkView.Avalonia.Mermaid.Tests/**'
              - '!src/**/*.md'
            svg:
              - 'src/MarkView.Avalonia.Svg/**'
              - 'tests/MarkView.Avalonia.Svg.Tests/**'
              - '!src/**/*.md'
            syntax:
              - 'src/MarkView.Avalonia.SyntaxHighlighting/**'
              - 'tests/MarkView.Avalonia.SyntaxHighlighting.Tests/**'
              - '!src/**/*.md'
            samples:
              - 'samples/**'
              - '!**/*.md'

      - name: Plan the run
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          DRAFT: ${{ github.event.pull_request.draft }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          SHARED: ${{ steps.filter.outputs.shared }}
          CORE: ${{ steps.filter.outputs.core }}
          MATH: ${{ steps.filter.outputs.math }}
          MERMAID: ${{ steps.filter.outputs.mermaid }}
          SVG: ${{ steps.filter.outputs.svg }}
          SYNTAX: ${{ steps.filter.outputs.syntax }}
          SAMPLES: ${{ steps.filter.outputs.samples }}
        run: |
          all_os='["ubuntu-latest","windows-latest","macos-latest"]'
          all_projects='["MarkView.Avalonia.Tests","MarkView.Avalonia.Math.Tests","MarkView.Avalonia.Mermaid.Tests","MarkView.Avalonia.Svg.Tests","MarkView.Avalonia.SyntaxHighlighting.Tests"]'
          has_label() { echo "$LABELS" | jq -e --arg l "$1" 'index($l) != null' > /dev/null; }

          if [ "$EVENT" != "pull_request" ]; then
            build_os=$all_os
            aot_os=$all_os
            if [ "$EVENT" = "release" ]; then mutation_projects='[]'; else mutation_projects=$all_projects; fi
            since=''
            # The commit main pointed to before this push, when this push only added commits on top
            # of it: a new branch has no previous commit (all zeros) and a force push leaves it off
            # the history.
            if [ "$EVENT" = "push" ] && [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
              status=$(gh api "repos/$REPO/compare/$BEFORE...$SHA" --jq .status || true)
              if [ "$status" = "ahead" ]; then since=$BEFORE; fi
            fi
          else
            full=false
            if has_label ci-full; then full=true; fi
            heavy=true
            if [ "$DRAFT" = "true" ] && [ "$full" = false ] && ! has_label ci-run-on-draft; then heavy=false; fi

            code=false
            for flag in "$SHARED" "$CORE" "$MATH" "$MERMAID" "$SVG" "$SYNTAX"; do
              if [ "$flag" = "true" ]; then code=true; fi
            done

            build_os='[]'
            if [ "$code" = true ]; then
              if [ "$heavy" = true ]; then build_os=$all_os; else build_os='["ubuntu-latest"]'; fi
            fi

            aot_os='[]'
            if [ "$heavy" = true ] && { [ "$code" = true ] || [ "$SAMPLES" = "true" ]; }; then
              if [ "$full" = true ]; then aot_os=$all_os; else aot_os='["ubuntu-latest"]'; fi
            fi

            # Mutation testing is the slowest suite, so pull requests only run it on request. The
            # label asks for it explicitly, so it runs on a draft too.
            mutation_projects='[]'
            since=''
            if [ "$full" = true ] || has_label ci-mutation-testing; then
              if [ "$full" = true ] || [ "$SHARED" = "true" ]; then
                mutation_projects=$all_projects
              else
                list=()
                if [ "$CORE" = "true" ]; then list+=("MarkView.Avalonia.Tests"); fi
                if [ "$MATH" = "true" ]; then list+=("MarkView.Avalonia.Math.Tests"); fi
                if [ "$MERMAID" = "true" ]; then list+=("MarkView.Avalonia.Mermaid.Tests"); fi
                if [ "$SVG" = "true" ]; then list+=("MarkView.Avalonia.Svg.Tests"); fi
                if [ "$SYNTAX" = "true" ]; then list+=("MarkView.Avalonia.SyntaxHighlighting.Tests"); fi
                mutation_projects=$(printf '%s\n' "${list[@]}" | jq -R . | jq -cs 'map(select(. != ""))')
              fi
              if [ "$full" = false ]; then
                # In a stack of pull requests, github.base_ref is the stack's base (main) for every
                # pull request in it, so diffing against it would mutate the whole stack below. The
                # pull request's own base branch is only in the API.
                own_base=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq .base.ref || true)
                since="origin/${own_base:-$BASE_REF}"
              fi
            fi
          fi

          {
            echo "build-os=$build_os"
            echo "aot-os=$aot_os"
            echo "mutation-projects=$mutation_projects"
            echo "mutation-since=$since"
          } | tee -a "$GITHUB_OUTPUT"

  build:
    needs: changes
    if: needs.changes.outputs.build-os != '[]'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.build-os) }}
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/build.yml
    with:
      os: ${{ matrix.os }}
      coverage: ${{ matrix.os == 'ubuntu-latest' }}

  aot-publish:
    needs: changes
    if: needs.changes.outputs.aot-os != '[]'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.aot-os) }}
    uses: ./.github/workflows/aot-publish.yml
    with:
      os: ${{ matrix.os }}

  mutation:
    needs: changes
    if: needs.changes.outputs.mutation-projects != '[]'
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/mutation.yml
    with:
      projects: ${{ needs.changes.outputs.mutation-projects }}
      since: ${{ needs.changes.outputs.mutation-since }}

  # The only check branch protection needs to require. Skipped jobs (nothing to run for
  # these changes, or a draft) count as passing; a failed or cancelled one does not.
  # always() on purpose: a cancelled run must report a red Gate, not a skipped one.
  gate:
    name: Gate
    needs: [changes, build, aot-publish, mutation]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any needed job failed or was cancelled
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.value.result)\t\(.key)"'
          test "$(echo "$NEEDS" | jq '[.[] | select(.result == "failure" or .result == "cancelled")] | length')" -eq 0

  publish:
    needs: [build, aot-publish]
    if: github.event_name == 'release'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish.yml
    with:
      dry-run: false
