name: PR Labels

# Runs what a CI label asks for at the moment it is added, without restarting the whole CI.
# Later pushes pick the label up in ci.yml.
#
# - `ci-full`: the AOT publish on Windows and macOS (CI already covers Ubuntu) and a full,
#   non-incremental mutation run of every test project.
# - `ci-mutation-testing`: the incremental mutation run that ci.yml makes on later pushes (the
#   packages the pull request touches, only the code it changes; see ci-plan.yml). Nothing when
#   the pull request is also labelled `ci-full`, which already runs it in full.
# - `ci-run-on-draft`: nothing here; ci.yml runs the normal suites on the draft's next push.
#
# Adding a label needs write access to the repository, so the label is the authorization.
# These are separate checks: they do not feed ci.yml's Gate.

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}-${{ github.event.label.name }}
  cancel-in-progress: true

jobs:
  aot-publish:
    if: github.event.label.name == 'ci-full'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    uses: ./.github/workflows/aot-publish.yml
    with:
      os: ${{ matrix.os }}

  mutation:
    if: github.event.label.name == 'ci-full'
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/mutation.yml

  plan:
    if: >
      github.event.label.name == 'ci-mutation-testing'
      && !contains(github.event.pull_request.labels.*.name, 'ci-full')
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/ci-plan.yml

  incremental-mutation:
    needs: plan
    if: needs.plan.outputs.mutation-projects != '[]'
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/mutation.yml
    with:
      projects: ${{ needs.plan.outputs.mutation-projects }}
      since: ${{ needs.plan.outputs.mutation-since }}
