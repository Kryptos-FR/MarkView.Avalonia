name: PR Labels

# Runs what a CI label asks for at the moment it is added, without restarting the whole CI.
# Later pushes pick the label up in ci.yml.
#
# - `ci-full`: the AOT publish on Windows and macOS (CI already covers Ubuntu) and a full,
#   non-incremental mutation run of every test project.
# - `ci-mutation-testing`: an incremental mutation run (Stryker's `--since` the pull request's
#   own base) of every test project; the projects the pull request does not touch test no
#   mutants. Later pushes run it from ci.yml, for the touched projects only. Nothing when the
#   pull request is also labelled `ci-full`, which already runs it in full.
# - `ci-run-on-draft`: nothing here; ci.yml runs the normal suites on the draft's next push.
#
# Adding a label needs write access to the repository, so the label is the authorization.
# These are separate checks: they do not feed ci.yml's Gate.

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}-${{ github.event.label.name }}
  cancel-in-progress: true

jobs:
  aot-publish:
    if: github.event.label.name == 'ci-full'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    uses: ./.github/workflows/aot-publish.yml
    with:
      os: ${{ matrix.os }}

  # In a stack of pull requests, github.base_ref is the stack's base (main) for every pull
  # request in it, so diffing against it would mutate the whole stack below. The pull request's
  # own base branch is only in the API.
  mutation-base:
    if: >
      github.event.label.name == 'ci-mutation-testing'
      && !contains(github.event.pull_request.labels.*.name, 'ci-full')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      since: ${{ steps.base.outputs.since }}
    steps:
      - id: base
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          own_base=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq .base.ref || true)
          echo "since=origin/${own_base:-$BASE_REF}" | tee -a "$GITHUB_OUTPUT"

  # Full for `ci-full`, incremental for `ci-mutation-testing`.
  mutation:
    needs: mutation-base
    if: >
      !cancelled()
      && (github.event.label.name == 'ci-full' || needs.mutation-base.result == 'success')
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/mutation.yml
    with:
      since: ${{ needs.mutation-base.outputs.since }}
