name: Feature request
description: Something MarkView.Avalonia doesn't do yet.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        For an open-ended idea you'd like to talk through first, the [Ideas discussions](https://github.com/Kryptos-FR/MarkView.Avalonia/discussions/categories/ideas) are a good place to start.
  - type: textarea
    id: problem
    attributes:
      label: What you're trying to do
      description: The use case behind the request, such as the kind of app and documents you show.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: How it could work, for example a property, an extension method or a Markdown construct. Markdown examples are welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you do today
      description: Any workaround you use now, or how another library or GitHub handles it.
